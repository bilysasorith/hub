<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1013">
<!-- Applique le thème mémorisé avant le rendu (évite le flash de couleur). -->
<script>try{var t=localStorage.getItem("hub-theme");if(t){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="dark"?"#0D1013":"#F1F3F5";}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="description" content="Emploi du temps et tâches, au même endroit.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Jeu d'icônes dessinées (trait 1.6, cohérent) réutilisées via <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3M16 3.5v3"/><path d="M8.5 14.5h4"/>
    </symbol>
    <symbol id="i-week" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M9 9.5v11M15 9.5v11"/>
    </symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.5l2 2 3-3.5"/><path d="M4 16.5l2 2 3-3.5"/><path d="M12.5 7h7.5M12.5 17h7.5"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s6.5-5.1 6.5-10.2A6.5 6.5 0 0 0 5.5 10.8C5.5 15.9 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="i-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4.2 2.5 8.6 12 13l9.5-4.4L12 4.2z"/><path d="M6.2 10.5v4.1c0 1.3 2.6 2.4 5.8 2.4s5.8-1.1 5.8-2.4v-4.1"/><path d="M21.5 8.6v5"/>
    </symbol>
    <symbol id="i-brief" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.4"/><path d="M12 7.3v5l3.2 2"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13.4A8 8 0 1 1 10.6 4a6.3 6.3 0 0 0 9.4 9.4z"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.5l4 4 10-10"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 2.5 20h19L12 4z"/><path d="M12 10v4M12 17h.01"/>
    </symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h13v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/><path d="M17 9h2.5a2 2 0 0 1 0 4H17"/>
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3"/>
    </symbol>
    <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8 20 7v10l-8 4.2L4 17V7l8-4.2z"/><path d="M4 7l8 4.2L20 7M12 11.2V21"/>
    </symbol>
    <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 8.5 4.5 12l4 3.5M15.5 8.5l4 3.5-4 3.5M13.2 6l-2.4 12"/>
    </symbol>
    <symbol id="i-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8V6M5 12c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8"/>
    </symbol>
    <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 5.5l4 4M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/>
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
    </symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 9.5v5M7.5 8v8M16.5 8v8M19 9.5v5M7.5 12h9"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6zM9.5 20a2.5 2.5 0 0 0 5 0"/>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.7" fill="currentColor"/>
    </symbol>
    <!-- Illustration de fond du héros (line-art, recoloré par currentColor) -->
    <symbol id="art-plan" viewBox="0 0 200 140" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="26" y="24" width="120" height="96" rx="12"/><path d="M26 48h120M58 24v-12M114 24v-12"/>
      <path d="M46 70h28M46 88h44M46 104h20"/><circle cx="150" cy="96" r="26"/><path d="M150 82v15l10 7"/>
    </symbol>
    <!-- Illustrations d'états vides (line-art duotone, recolorées par le thème) -->
    <symbol id="art-free" viewBox="0 0 220 170" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="110" cy="138" rx="78" ry="12" fill="var(--ok)" opacity=".10"/>
      <circle cx="110" cy="66" r="28" fill="var(--warn)" opacity=".16"/>
      <circle cx="110" cy="66" r="28" stroke="var(--warn)" stroke-width="2.6"/>
      <g stroke="var(--warn)" stroke-width="2.6"><path d="M110 22v-11M110 121v11M154 66h11M55 66h11M141 35l8-8M71 97l-8 8M141 97l8 8M71 35l-8-8"/></g>
      <path d="M78 118h40v10a16 16 0 0 1-16 16H94a16 16 0 0 1-16-16v-10z" fill="var(--surface-2)" stroke="var(--ok)" stroke-width="2.6"/>
      <path d="M118 122h9a8 8 0 0 1 0 16h-9" stroke="var(--ok)" stroke-width="2.6"/>
      <path d="M90 104c0-5 5-5 5-10M104 104c0-5 5-5 5-10" stroke="var(--ok)" stroke-width="2.4" opacity=".8"/>
    </symbol>
    <symbol id="art-done" viewBox="0 0 220 170" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="110" cy="140" rx="74" ry="11" fill="var(--accent)" opacity=".10"/>
      <rect x="54" y="34" width="112" height="100" rx="12" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2.6"/>
      <g stroke="var(--ok)" stroke-width="2.6"><path d="M70 60l5 5 8-9M70 86l5 5 8-9M70 112l5 5 8-9"/></g>
      <g stroke="var(--muted)" stroke-width="2.4" opacity=".7"><path d="M94 58h56M94 84h56M94 110h40"/></g>
      <circle cx="158" cy="42" r="18" fill="var(--ok)" opacity=".18"/>
      <circle cx="158" cy="42" r="18" stroke="var(--ok)" stroke-width="2.6"/>
      <path d="M150 42l6 6 10-11" stroke="var(--ok)" stroke-width="2.8"/>
      <g stroke="var(--accent)" stroke-width="2.4"><path d="M40 52l0 10M35 57l10 0"/><path d="M176 96l0 8M172 100l8 0"/></g>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="top wrap">
    <div class="top-row">
      <div>
        <h1 id="top-title">Aujourd'hui</h1>
        <p class="top-date num" id="top-date">—</p>
      </div>
      <div class="top-actions">
        <span class="live" id="live" title="Planning à jour"><i></i><span class="num" id="live-time">··:··</span></span>
        <button class="icon-btn notif" id="notif-bell" type="button" aria-label="Changements du planning" hidden>
          <svg class="icon-btn-ico" aria-hidden="true"><use href="#i-bell"/></svg>
          <span class="notif-badge" id="notif-badge" hidden></span>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème">
          <svg class="icon-btn-ico" aria-hidden="true"><use id="theme-icon" href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap" id="view" aria-live="polite"></main>
</div>

<nav class="tabs" role="tablist" aria-label="Navigation">
  <button class="tab is-active" data-view="today" role="tab" aria-selected="true">
    <svg class="tab-ico"><use href="#i-today"/></svg><span>Aujourd'hui</span>
  </button>
  <button class="tab" data-view="week" role="tab" aria-selected="false">
    <svg class="tab-ico"><use href="#i-week"/></svg><span>Semaine</span>
  </button>
  <button class="tab" data-view="tasks" role="tab" aria-selected="false">
    <svg class="tab-ico"><use href="#i-tasks"/></svg><span>À faire</span>
  </button>
</nav>

<script src="config.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
